spring.application.name=delivery

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

gateway.routes.cliente-service-url=${CLIENTE_SERVICE_URL:http://localhost:8081}
gateway.routes.loja-service-url=${LOJA_SERVICE_URL:http://localhost:8082}
