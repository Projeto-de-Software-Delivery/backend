name: CI/CD Delivery

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: brttemily
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: brttemily/delivery:${{ github.sha }}

      - name: Deploy na EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker stop delivery || true
            docker rm --force delivery || true

            docker pull brttemily/delivery:${{ github.sha }}

            docker run -d \
              --name delivery \
              --network rede-delivery \
              -p 8081:8080 \
              -e DB_HOST=postgres-delivery \
              -e DB_PORT=5432 \
              -e DB_NAME=delivery \
              -e DB_USER=usuario \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              brttemily/delivery:${{ github.sha }}
